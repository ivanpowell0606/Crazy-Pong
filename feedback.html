<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crazy Pong — Feedback</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6G72V1D95D"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6G72V1D95D');
  </script>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: clamp(14px, 1.6vw, 18px); }
    body {
      background: #0a0a0a; color: #fff;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 48px 16px 64px;
    }
    h1 {
      font-size: 2.4rem; letter-spacing: 0.5rem;
      text-shadow: 0 0 20px rgba(255,255,255,0.3);
      margin-bottom: 0.3rem;
    }
    .subtitle {
      font-size: 0.72rem; color: #444; letter-spacing: 0.18rem;
      margin-bottom: 2.4rem;
    }
    .back-link {
      font-size: 0.6rem; color: #333; letter-spacing: 0.14rem;
      text-decoration: none; margin-bottom: 2rem;
      transition: color 0.12s;
    }
    .back-link:hover { color: #aaa; }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex; gap: 2rem; margin-bottom: 2rem;
      border: 1px solid #1a1a1a; padding: 1rem 2rem;
    }
    .stat { text-align: center; }
    .stat-val { font-size: 1.6rem; color: #fff; letter-spacing: 0.1rem; }
    .stat-label { font-size: 0.52rem; color: #444; letter-spacing: 0.12rem; margin-top: 2px; }
    .stars-avg { color: #fff; font-size: 1.2rem; letter-spacing: 2px; }

    /* ── Feedback cards ── */
    #feedback-list {
      width: 100%; max-width: 640px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .feedback-card {
      border: 1px solid #1a1a1a; padding: 1rem 1.2rem;
      display: flex; flex-direction: column; gap: 6px;
      position: relative;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
    }
    .card-name { font-size: 0.72rem; color: #aaa; letter-spacing: 0.08rem; }
    .card-date { font-size: 0.55rem; color: #333; letter-spacing: 0.06rem; }
    .card-stars { font-size: 0.9rem; letter-spacing: 2px; color: #fff; }
    .card-comment { font-size: 0.68rem; color: #666; letter-spacing: 0.04rem; line-height: 1.6; }
    .delete-btn {
      display: none; position: absolute; top: 8px; right: 8px;
      padding: 3px 8px; border: 1px solid #f44336; background: transparent;
      color: #f44336; font-family: 'Courier New', monospace; font-size: 0.52rem;
      letter-spacing: 0.08rem; cursor: pointer; border-radius: 2px;
      transition: background 0.12s, color 0.12s;
    }
    .delete-btn:hover { background: #f44336; color: #0a0a0a; }
    body.admin-mode .delete-btn { display: block; }

    /* ── Admin panel ── */
    #admin-panel {
      margin-top: 2.4rem; width: 100%; max-width: 640px;
      border-top: 1px solid #1a1a1a; padding-top: 1.2rem;
      display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
    }
    .admin-label { font-size: 0.52rem; color: #222; letter-spacing: 0.14rem; }
    .admin-row { display: flex; gap: 8px; width: 100%; max-width: 300px; }
    .admin-input {
      flex: 1; background: transparent; border: 1px solid #1a1a1a; color: #fff;
      font-family: 'Courier New', monospace; font-size: 0.7rem;
      padding: 0.4rem 0.6rem; outline: none; border-radius: 2px;
    }
    .admin-input:focus { border-color: #333; }
    .admin-btn {
      padding: 0.4rem 0.8rem; border: 1px solid #333; background: transparent;
      color: #444; font-family: 'Courier New', monospace; font-size: 0.6rem;
      letter-spacing: 0.1rem; cursor: pointer; border-radius: 2px;
      transition: border-color 0.12s, color 0.12s;
    }
    .admin-btn:hover { border-color: #aaa; color: #aaa; }
    #admin-err { font-size: 0.58rem; color: #f44336; letter-spacing: 0.06rem; min-height: 1em; }

    /* ── Loading / empty ── */
    #loading { font-size: 0.65rem; color: #333; letter-spacing: 0.12rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <h1>CRAZY PONG</h1>
  <p class="subtitle">PLAYER FEEDBACK</p>
  <a class="back-link" href="/">← BACK TO GAME</a>

  <div class="stats-bar" id="stats-bar" style="display:none">
    <div class="stat">
      <div class="stat-val" id="total-count">0</div>
      <div class="stat-label">TOTAL REVIEWS</div>
    </div>
    <div class="stat">
      <div class="stars-avg" id="avg-stars">—</div>
      <div class="stat-label">AVERAGE RATING</div>
    </div>
  </div>

  <div id="feedback-list">
    <p id="loading">LOADING FEEDBACK…</p>
  </div>

  <div id="admin-panel">
    <p class="admin-label">ADMIN ACCESS</p>
    <div class="admin-row">
      <input class="admin-input" id="admin-pass" type="text"
        placeholder="ADMIN PASSWORD"
        style="-webkit-text-security:disc;text-security:disc"
        autocomplete="off" data-lpignore="true" data-form-type="other">
      <button class="admin-btn" onclick="adminLogin()">ENTER</button>
    </div>
    <p id="admin-err"></p>
  </div>

  <script>
    const FEEDBACK_URL = 'https://script.google.com/macros/s/AKfycbyHsN4n60qgurpZc24uOhQyvYA1Pe8kyJzpomt_3hYJ3-S16kJ1YDB3Hd_vA0bBNAoa1g/exec';

    // ── Load and display feedback ────────────────────────────────────────────
    async function loadFeedback() {
      try {
        const res  = await fetch(FEEDBACK_URL + '?action=getFeedback');
        const data = await res.json();
        const list = document.getElementById('feedback-list');
        list.innerHTML = '';

        if (!data.ok || !data.feedback || data.feedback.length === 0) {
          list.innerHTML = '<p style="font-size:0.65rem;color:#333;letter-spacing:0.1rem">NO FEEDBACK YET — BE THE FIRST!</p>';
          return;
        }

        // Stats
        const total  = data.feedback.length;
        const avgRaw = data.feedback.reduce((s, f) => s + f.rating, 0) / total;
        const avg    = Math.round(avgRaw * 10) / 10;
        const stars  = '★'.repeat(Math.round(avg)) + '☆'.repeat(5 - Math.round(avg));
        document.getElementById('total-count').textContent = total;
        document.getElementById('avg-stars').textContent   = stars + ' ' + avg;
        document.getElementById('stats-bar').style.display = 'flex';

        // Cards
        data.feedback.reverse().forEach(f => {
          const filled  = '★'.repeat(f.rating);
          const empty   = '☆'.repeat(5 - f.rating);
          const card    = document.createElement('div');
          card.className = 'feedback-card';
          card.dataset.id = f.id;
          card.innerHTML = `
            <div class="card-header">
              <span class="card-name">${escHtml(f.name)}</span>
              <span class="card-date">${f.date || ''}</span>
            </div>
            <div class="card-stars">${filled}<span style="color:#222">${empty}</span></div>
            ${f.comment ? `<p class="card-comment">${escHtml(f.comment)}</p>` : ''}
            <button class="delete-btn" onclick="deleteFeedback('${f.id}', this)">✕ DELETE</button>
          `;
          list.appendChild(card);
        });
      } catch(e) {
        document.getElementById('loading').textContent = 'Could not load feedback.';
      }
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Admin login ──────────────────────────────────────────────────────────
    async function adminLogin() {
      const pass = document.getElementById('admin-pass').value;
      const errEl = document.getElementById('admin-err');
      if (!pass) return;
      try {
        const res  = await fetch(FEEDBACK_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'adminLogin', password: pass }),
        });
        const data = await res.json();
        if (data.ok) {
          document.body.classList.add('admin-mode');
          document.getElementById('admin-panel').style.display = 'none';
          sessionStorage.setItem('cpong_admin', pass);
        } else {
          errEl.textContent = 'Incorrect password.';
        }
      } catch(e) {
        errEl.textContent = 'Network error.';
      }
    }

    // ── Delete feedback ──────────────────────────────────────────────────────
    async function deleteFeedback(id, btn) {
      const pass = sessionStorage.getItem('cpong_admin');
      if (!pass) return;
      btn.textContent = '…';
      try {
        const res  = await fetch(FEEDBACK_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'deleteFeedback', id, password: pass }),
        });
        const data = await res.json();
        if (data.ok) {
          btn.closest('.feedback-card').remove();
        } else {
          btn.textContent = '✕ DELETE';
        }
      } catch(e) {
        btn.textContent = '✕ DELETE';
      }
    }

    // ── Auto admin if session has password ───────────────────────────────────
    const savedAdmin = sessionStorage.getItem('cpong_admin');
    if (savedAdmin) {
      document.body.classList.add('admin-mode');
      document.getElementById('admin-panel').style.display = 'none';
    }

    loadFeedback();
  </script>
</body>
</html>
